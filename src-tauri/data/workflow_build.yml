name: 'PakePlus Build'

on:
    workflow_dispatch:
        inputs:
            build_macos_aarch64:
                description: 'Build for macOS aarch64'
                required: false
                type: boolean
                default: false
            build_macos_x86_64:
                description: 'Build for macOS x86_64'
                required: false
                type: boolean
                default: false
            build_linux_x86_64:
                description: 'Build for Linux x86_64'
                required: false
                type: boolean
                default: false
            build_linux_aarch64:
                description: 'Build for Linux aarch64'
                required: false
                type: boolean
                default: false
            build_windows_x86_64:
                description: 'Build for Windows x86_64'
                required: false
                type: boolean
                default: true
            build_windows_aarch64:
                description: 'Build for Windows aarch64'
                required: false
                type: boolean
                default: false

permissions:
    contents: write

jobs:
    build_windows_x86_64:
        if: ${{ github.event.inputs.build_windows_x86_64 == 'true' }}
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.14.0
            - uses: dtolnay/rust-toolchain@stable
            - run: pnpm install
            - run: Remove-Item -Recurse -Force ./dist -ErrorAction SilentlyContinue
              shell: pwsh
            - run: pnpm build
            - run: |
                $cfg = $null
                if (Test-Path "scripts/ppconfig.json") {
                    $cfg = Get-Content "scripts/ppconfig.json" -Raw | ConvertFrom-Json
                }
                if ($cfg) {
                    $name = if ($cfg.showName) { $cfg.showName } elseif ($cfg.name) { $cfg.name } else { "PakePlus" }
                    $url = if ($cfg.url) { $cfg.url } else { "https://juejin.cn/" }
                    $ver = if ($cfg.version) { $cfg.version } else { "0.0.1" }
                    $w = if ($cfg.width) { $cfg.width } else { 800 }
                    $h = if ($cfg.height) { $cfg.height } else { 600 }
                } else {
                    $name = "PakePlus"
                    $url = "https://juejin.cn/"
                    $ver = "0.0.1"
                    $w = 800
                    $h = 600
                }
                Write-Host "App: $name URL: $url Ver: $ver Size: ${w}x${h}"
                if (Test-Path "src-tauri/tauri.conf.json") {
                    $tc = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
                    $tc.productName = $name
                    $tc.identifier = if ($cfg -and $cfg.appid) { $cfg.appid } else { "com.pakeplus.app" }
                    $tc | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/tauri.conf.json"
                }
                if (Test-Path "src-tauri/data/man.json") {
                    $mj = Get-Content "src-tauri/data/man.json" -Raw | ConvertFrom-Json
                    $mj.name = $name
                    $mj.version = $ver
                    $mj.window.title = $name
                    $mj.window.url = $url
                    $mj.window.width = $w
                    $mj.window.height = $h
                    $mj | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/data/man.json"
                }
                Write-Host "Applied config: $name"
              shell: pwsh
            - run: |
                $env:TAURI_SIGNING_PRIVATE_KEY = ${{ secrets.TAURI_PRIVATE_KEY }}
                $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ${{ secrets.TAURI_KEY_PASSWORD }}
                if (Test-Path "$env:TAURI_SIGNING_PRIVATE_KEY") {
                    Write-Host "Using signed build"
                    pnpm tauri build
                } else {
                    Write-Host "Using unsigned dev build"
                    pnpm tauri build --debug
                }
              shell: pwsh
              working-directory: src-tauri
            - uses: actions/upload-artifact@v3
              with:
                  name: pakeplus-windows-x86_64
                  path: |
                      src-tauri/target/release/bundle/**/*
                      src-tauri/target/debug/bundle/**/*

    build_windows_aarch64:
        if: ${{ github.event.inputs.build_windows_aarch64 == 'true' }}
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.14.0
            - uses: dtolnay/rust-toolchain@stable
            - run: pnpm install
            - run: rustup target add aarch64-pc-windows-msvc
            - run: Remove-Item -Recurse -Force ./dist -ErrorAction SilentlyContinue
              shell: pwsh
            - run: pnpm build
            - run: pnpm tauri build --debug --target aarch64-pc-windows-msvc
              shell: pwsh
              working-directory: src-tauri
            - uses: actions/upload-artifact@v3
              with:
                  name: pakeplus-windows-aarch64
                  path: |
                      src-tauri/target/release/bundle/**/*
                      src-tauri/target/debug/bundle/**/*

    build_macos_aarch64:
        if: ${{ github.event.inputs.build_macos_aarch64 == 'true' }}
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.14.0
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-apple-darwin
            - run: pnpm install
            - run: rm -rf ./dist
            - run: pnpm build
            - run: pnpm tauri build --debug --target aarch64-apple-darwin
              working-directory: src-tauri
            - uses: actions/upload-artifact@v3
              with:
                  name: pakeplus-macos-aarch64
                  path: |
                      src-tauri/target/release/bundle/**/*
                      src-tauri/target/debug/bundle/**/*

    build_macos_x86_64:
        if: ${{ github.event.inputs.build_macos_x86_64 == 'true' }}
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.14.0
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-apple-darwin
            - run: pnpm install
            - run: rm -rf ./dist
            - run: pnpm build
            - run: pnpm tauri build --debug --target x86_64-apple-darwin
              working-directory: src-tauri
            - uses: actions/upload-artifact@v3
              with:
                  name: pakeplus-macos-x86_64
                  path: |
                      src-tauri/target/release/bundle/**/*
                      src-tauri/target/debug/bundle/**/*

    build_linux_x86_64:
        if: ${{ github.event.inputs.build_linux_x86_64 == 'true' }}
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.14.0
            - uses: dtolnay/rust-toolchain@stable
            - run: pnpm install
            - name: Install deps
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
            - run: rm -rf ./dist
            - run: pnpm build
            - run: pnpm tauri build --debug
              working-directory: src-tauri
            - uses: actions/upload-artifact@v3
              with:
                  name: pakeplus-linux-x86_64
                  path: |
                      src-tauri/target/release/bundle/**/*
                      src-tauri/target/debug/bundle/**/*

    build_linux_aarch64:
        if: ${{ github.event.inputs.build_linux_aarch64 == 'true' }}
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.14.0
            - uses: dtolnay/rust-toolchain@stable
            - run: pnpm install
            - name: Install deps
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
            - run: rustup target add aarch64-unknown-linux-gnu
            - run: rm -rf ./dist
            - run: pnpm build
            - run: pnpm tauri build --debug --target aarch64-unknown-linux-gnu
              working-directory: src-tauri
            - uses: actions/upload-artifact@v3
              with:
                  name: pakeplus-linux-aarch64
                  path: |
                      src-tauri/target/release/bundle/**/*
                      src-tauri/target/debug/bundle/**/*